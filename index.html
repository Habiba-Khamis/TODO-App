<!DOCTYPE html>
<html>
    <head>

        <title>Simple To-Do App</title>
        <link rel="stylesheet" href="style.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Amarante&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Emilys+Candy&family=Gravitas+One&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer"> 
    </head>

    <body>
        <header>
            <h2>My To-Do List</h2>
        </header>

        <form>
            <input type="text" class="todo-input"/> 
            <button type="submit" class="todo-button">
                <i class="fa-solid fa-circle-plus"></i>
            </button>
        </form>

        <div class="todo-container">
            <ul class="todo-list">

            </ul>
        </div>
        
        
        
        <script src="./app.js"></script>
    </body>
</html>
